<!-- IAM Access Analyzer archive rule partial -->
<script id="services.accessanalyzer.regions.id.analyzers.id.archive_rules.partial" type="text/x-handlebars-template">
    <div id="resource-name" class="list-group-item active">
      <h4 class="list-group-item-heading">{{name}}</h4>
    </div>
    <div class="list-group-item">
      <h4 class="list-group-item-heading">Information</h4>
      <div class="list-group-item-text item-margin">Name: <samp>{{value_or_none name}}</samp></div>
      <div class="list-group-item-text item-margin">Region: <samp>{{value_or_none region}}</samp></div>
      <div class="list-group-item-text item-margin">Analyzer: <a href="javascript:showObject('services.accessanalyzer.regions.{{region}}.analyzers.{{analyzer}}')"><samp>{{analyzer}}</samp></a></div>
      <div class="list-group-item-text item-margin">Created at: <samp>{{value_or_none creation_time}}</samp></div>
      <div class="list-group-item-text item-margin">Last updated at: <samp>{{value_or_none last_updated_time}}</samp></div>
      <div class="list-group-item-text item-margin">Archives findings of public access: <span id="accessanalyzer.regions.{{region}}.analyzers.{{analyzer}}.archive_rules.{{id}}.archives_public_access"><samp>{{value_or_none archives_public_access}}</samp></span></div>
    </div>
    <div class="list-group-item">
      <h4 class="list-group-item-heading">Filter</h4>
      <ul>
        {{#each criteria}}
        <li class="list-group-item-text">
          <samp>{{key}}</samp>
          {{#if equals}}equals {{#each equals}}<samp>{{this}}</samp> {{/each}}{{/if}}
          {{#if not_equals}}differs from {{#each not_equals}}<samp>{{this}}</samp> {{/each}}{{/if}}
          {{#if contains}}contains {{#each contains}}<samp>{{this}}</samp> {{/each}}{{/if}}
          {{#if exists}}exists{{/if}}
        </li>
        {{/each}}
      </ul>
    </div>
</script>
<script>
  Handlebars.registerPartial("services.accessanalyzer.regions.id.analyzers.id.archive_rules", $("#services\\.accessanalyzer\\.regions\\.id\\.analyzers\\.id\\.archive_rules\\.partial").html());
</script>

<!-- Single IAM Access Analyzer archive rule template -->
<script id="single_accessanalyzer_archive_rule-template" type="text/x-handlebars-template">
  {{> modal-template template='services.accessanalyzer.regions.id.analyzers.id.archive_rules' }}
</script>
<script>
  var single_accessanalyzer_archive_rule_template = Handlebars.compile($("#single_accessanalyzer_archive_rule-template").html());
</script>
