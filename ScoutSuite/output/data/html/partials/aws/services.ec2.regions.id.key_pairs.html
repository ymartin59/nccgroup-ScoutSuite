<!-- EC2 key pairs partial -->
<script id="services.ec2.regions.id.key_pairs.partial" type="text/x-handlebars-template">
    <div id="resource-name" class="list-group-item active">
        <h4 class="list-group-item-heading">{{name}}</h4>
    </div>
    <div class="list-group-item">
        <h4 class="list-group-item-heading">Information</h4>
        <div class="list-group-item-text item-margin">Name: <samp>{{value_or_none name}}</samp></div>
        <div class="list-group-item-text item-margin">ID: <samp>{{value_or_none id}}</samp></div>
        <div class="list-group-item-text item-margin">ARN: <samp>{{value_or_none arn}}</samp></div>
        <div class="list-group-item-text item-margin">Key type: <samp>{{value_or_none key_type}}</samp></div>
        <div class="list-group-item-text item-margin">Fingerprint: <samp>{{value_or_none key_fingerprint}}</samp></div>
        <div class="list-group-item-text item-margin">Created at: <span id="ec2.regions.{{region}}.key_pairs.{{@key}}.create_time"><samp>{{value_or_none create_time}}</samp></span></div>
        <div class="list-group-item-text item-margin">Used: <span id="ec2.regions.{{region}}.key_pairs.{{@key}}.used"><samp>{{value_or_none used}}</samp></span></div>
    </div>
    <div class="list-group-item">
        <h4 class="list-group-item-heading accordion-heading">Instances
            {{> count_badge count=instances.length}}
        </h4>
        <ul>
            {{#each instances}}
            <li class="list-group-item-text"><a href="javascript:findAndShowEC2Object('regions.vpcs.instances', '{{this}}')">{{this}}</a></li>
            {{/each}}
        </ul>
    </div>
</script>

<script>
    Handlebars.registerPartial("services.ec2.regions.id.key_pairs", $("#services\\.ec2\\.regions\\.id\\.key_pairs\\.partial").html());
</script>

<!-- Single key pair template -->
<script id="single_ec2_key_pair-template" type="text/x-handlebars-template">
    {{> modal-template template='services.ec2.regions.id.key_pairs'}}
</script>
<script>
    var single_ec2_key_pair_template = Handlebars.compile($("#single_ec2_key_pair-template").html());
</script>
