<!-- Account region opt-in status partial -->
<script id="services.account.region_opt_status.partial" type="text/x-handlebars-template">
    <div id="resource-name" class="list-group-item active">
        <h4 class="list-group-item-heading">{{name}}</h4>
    </div>
    <div class="list-group-item">
        <h4 class="list-group-item-heading">Region</h4>
        <div class="list-group-item-text item-margin">Name: <samp>{{name}}</samp></div>
        <div class="list-group-item-text item-margin">Opt-in status: <span id="account.region_opt_status.{{@key}}.opt_status"><samp>{{value_or_none opt_status}}</samp></span></div>
        <div class="list-group-item-text item-margin">Enabled: <samp>{{value_or_none enabled}}</samp></div>
        <div class="list-group-item-text item-margin">Enabled by default: <samp>{{value_or_none enabled_by_default}}</samp></div>
        <div class="list-group-item-text item-margin">Enabled by opt-in: <span id="account.region_opt_status.{{@key}}.enabled_by_opt_in"><samp>{{value_or_none enabled_by_opt_in}}</samp></span></div>
    </div>
</script>

<script>
    Handlebars.registerPartial("services.account.region_opt_status", $("#services\\.account\\.region_opt_status\\.partial").html());
</script>

<!-- Single region opt-in status template -->
<script id="single_account_region-template" type="text/x-handlebars-template">
    {{> modal-template template='services.account.region_opt_status'}}
</script>
<script>
    var single_account_region_template = Handlebars.compile($("#single_account_region-template").html());
</script>
