
<!-- VPC endpoints -->
<script id="services.vpc.regions.id.vpc_endpoints.partial" type="text/x-handlebars-template">
    <div id="resource-name" class="list-group-item active">
        <h4 class="list-group-item-heading">{{name}}</h4>
    </div>
    <div class="list-group-item">
        <h4 class="list-group-item-heading">Information</h4>
        <div class="list-group-item-text item-margin">ID: <span id="vpc.regions.{{region}}.vpc_endpoints.{{@key}}.id"><samp>{{value_or_none id}}</samp></span></div>
        <div class="list-group-item-text item-margin">ARN: <span id="vpc.regions.{{region}}.vpc_endpoints.{{@key}}.arn"><samp>{{value_or_none arn}}</samp></span></div>
        <div class="list-group-item-text item-margin">Service: <span id="vpc.regions.{{region}}.vpc_endpoints.{{@key}}.service_name"><samp>{{value_or_none service_name}}</samp></span></div>
        <div class="list-group-item-text item-margin">Type: <span id="vpc.regions.{{region}}.vpc_endpoints.{{@key}}.type"><samp>{{value_or_none type}}</samp></span></div>
        <div class="list-group-item-text item-margin">VPC: <span id="vpc.regions.{{region}}.vpc_endpoints.{{@key}}.vpc_id"><samp>{{value_or_none vpc_id}}</samp></span></div>
        <div class="list-group-item-text item-margin">State: <span id="vpc.regions.{{region}}.vpc_endpoints.{{@key}}.state"><samp>{{value_or_none state}}</samp></span></div>
        <div class="list-group-item-text item-margin">Private DNS: <span id="vpc.regions.{{region}}.vpc_endpoints.{{@key}}.private_dns_enabled">{{convert_bool_to_enabled private_dns_enabled}}</span></div>
    </div>
    {{#if route_table_ids}}
    <div class="list-group-item">
        <h4>Route Tables</h4>
        <ul>
            {{#each route_table_ids}}
            <li class="list-group-item-text"><samp>{{this}}</samp></li>
            {{/each}}
        </ul>
    </div>
    {{/if}}
    {{#if subnet_ids}}
    <div class="list-group-item">
        <h4>Subnets</h4>
        <ul>
            {{#each subnet_ids}}
            <li class="list-group-item-text"><samp>{{this}}</samp></li>
            {{/each}}
        </ul>
    </div>
    {{/if}}
    {{#if policy}}
        {{> accordion_policy name = 'Endpoint Policy' document = policy policy_path = (concat 'vpc.regions' region 'vpc_endpoints' @key 'policy')}}
    {{/if}}
    {{#if tags}}
    <div class="list-group-item">
        <h4>Tags</h4>
        <ul>
            {{#each tags}}
            <li class="list-group-item-text"><samp>{{Key}}</samp>: <samp>{{Value}}</samp></li>
            {{/each}}
        </ul>
    </div>
    {{/if}}
</script>

<script>
    Handlebars.registerPartial("services.vpc.regions.id.vpc_endpoints", $("#services\\.vpc\\.regions\\.id\\.vpc_endpoints\\.partial").html());
</script>

<!-- Single VPC endpoint template -->
<script id="single_vpc_vpc_endpoint-template" type="text/x-handlebars-template">
    {{> modal-template template='services.vpc.regions.id.vpc_endpoints'}}
</script>
<script>
    var single_vpc_vpc_endpoint_template = Handlebars.compile($("#single_vpc_vpc_endpoint-template").html());
</script>
