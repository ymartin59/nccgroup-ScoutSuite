<!-- ECR Image partial -->
<script id="services.ecr.regions.id.images.partial" type="text/x-handlebars-template">
    <div id="resource-name" class="list-group-item active">
      <h4 class="list-group-item-heading">{{name}}</h4>
    </div>
    <div class="list-group-item">
      <h4 class="list-group-item-heading">Information</h4>
      <div class="list-group-item-text item-margin">Repository: <span id="ecr.regions.{{region}}.images.{{@key}}.repository_name"><samp>{{value_or_none repository_name}}</samp></span></div>
      <div class="list-group-item-text item-margin">Image digest: <span id="ecr.regions.{{region}}.images.{{@key}}.image_digest"><samp>{{value_or_none image_digest}}</samp></span></div>
      <div class="list-group-item-text item-margin">Registry ID: <span id="ecr.regions.{{region}}.images.{{@key}}.registry_id"><samp>{{value_or_none registry_id}}</samp></span></div>
      <div class="list-group-item-text item-margin">Pushed at: <span id="ecr.regions.{{region}}.images.{{@key}}.pushed_at"><samp>{{value_or_none pushed_at}}</samp></span></div>
      <div class="list-group-item-text item-margin">Size in bytes: <span id="ecr.regions.{{region}}.images.{{@key}}.image_size_in_bytes"><samp>{{value_or_none image_size_in_bytes}}</samp></span></div>
    </div>
    {{#if image_tags}}
    <div class="list-group-item">
      <h4>Image Tags</h4>
      <ul>
        {{#each image_tags}}
        <li class="list-group-item-text"><samp>{{this}}</samp></li>
        {{/each}}
      </ul>
    </div>
    {{/if}}
    <div class="list-group-item">
      <h4 class="list-group-item-heading">Vulnerability Scan</h4>
      <div class="list-group-item-text item-margin">Scanned: <span id="ecr.regions.{{region}}.images.{{@key}}.scanned"><samp>{{scanned}}</samp></span></div>
      <div class="list-group-item-text item-margin">Status: <span id="ecr.regions.{{region}}.images.{{@key}}.scan_status"><samp>{{value_or_none scan_status}}</samp>{{#if scan_status_description}} ({{scan_status_description}}){{/if}}</span></div>
      <div class="list-group-item-text item-margin">Completed at: <span id="ecr.regions.{{region}}.images.{{@key}}.scan_completed_at"><samp>{{value_or_none scan_completed_at}}</samp></span></div>
      <div class="list-group-item-text item-margin">Findings:
        <span id="ecr.regions.{{region}}.images.{{@key}}.finding_severity_counts">
          <samp>{{critical_severity_count}}</samp> critical,
          <samp>{{high_severity_count}}</samp> high,
          <samp>{{medium_severity_count}}</samp> medium,
          <samp>{{low_severity_count}}</samp> low,
          <samp>{{informational_severity_count}}</samp> informational
        </span>
      </div>
    </div>
  </script>
  <script>
    Handlebars.registerPartial("services.ecr.regions.id.images", $("#services\\.ecr\\.regions\\.id\\.images\\.partial").html());
  </script>
  <!-- Single ECR Image template -->
  <script id="single_ecr_image-template" type="text/x-handlebars-template">
    {{> modal-template template='services.ecr.regions.id.images'}}
  </script>
  <script>
    var single_ecr_image_template = Handlebars.compile($("#single_ecr_image-template").html());
  </script>
